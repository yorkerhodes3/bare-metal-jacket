name: Lab backend monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      live_inference:
        description: Include one bounded local-model inference
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lab-backend-monitor
  cancel-in-progress: true

jobs:
  pages-ai-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify discovery, health, catalog, and CORS
        env:
          PAGES_AI_PROXY_LIVE: ${{ inputs.live_inference && '1' || '0' }}
          PAGES_AI_PROXY_MODEL: gemma3:12b
        run: npm run smoke:b3iq-proxy
