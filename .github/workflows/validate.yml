name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Validate documentation and contracts
        run: npm run check

      - name: Test example workload
        run: python -m unittest discover -s examples/hello-docker -p "test_*.py"

      - name: Validate Compose model
        run: >-
          docker compose
          --env-file deploy/compose/.env.example
          -f deploy/compose/docker-compose.yml
          --profile demo
          config

      - name: Build example workload
        run: docker build -t bare-metal-jacket/hello-docker:ci examples/hello-docker

      - name: Start deployment foundation
        run: >-
          docker compose
          --env-file deploy/compose/.env.example
          -f deploy/compose/docker-compose.yml
          --profile demo
          up --detach --build --wait

      - name: Smoke test deployment foundation
        run: npm run smoke:deployment

      - name: Create and verify foundation backup
        env:
          BMJ_ENV_FILE: deploy/compose/.env.example
        run: |
          npm run backup:foundation
          npm run verify:backup
          npm run smoke:deployment

      - name: Capture deployment logs
        if: failure()
        run: >-
          docker compose
          --env-file deploy/compose/.env.example
          -f deploy/compose/docker-compose.yml
          --profile demo
          logs --no-color

      - name: Stop deployment foundation
        if: always()
        run: >-
          docker compose
          --env-file deploy/compose/.env.example
          -f deploy/compose/docker-compose.yml
          --profile demo
          down --volumes --remove-orphans
